name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk testwearapp-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: testwearapp-debug-${{ github.run_number }}
          path: testwearapp-debug.apk

      # 固定タグ latest のReleaseは main への push のときだけ更新する
      - name: Update latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest testwearapp-debug.apk \
            --target "${{ github.sha }}" \
            --title "Latest build ${{ github.run_number }}" \
            --notes "build: ${{ github.run_number }}"
